name: Container — test and publish GHCR

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build native image and test VTracer
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: vector-studio:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Compose, HTTP, and WASM
        env:
          IMAGE: vector-studio
          IMAGE_TAG: smoke
        run: |
          docker compose config --quiet
          docker compose up -d --wait --wait-timeout 60
          curl --fail --retry 5 --retry-delay 2 http://localhost:8080/health
          curl --fail http://localhost:8080/ | grep -q 'Vector Studio'
          curl --fail --head http://localhost:8080/vendor/vtracer.wasm | grep -qi 'content-type: application/wasm'
          curl --fail http://localhost:8080/vendor/vtracer.wasm --output /tmp/vtracer.wasm
          cmp /tmp/vtracer.wasm dist/vendor/vtracer.wasm
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/missing.js)" = 404
          docker compose exec -T vector-studio sh -c 'test "$(id -u)" != 0'

      - name: Container logs
        if: always()
        env:
          IMAGE: vector-studio
          IMAGE_TAG: smoke
        run: docker compose logs --no-color

      - name: Stop test container
        if: always()
        env:
          IMAGE: vector-studio
          IMAGE_TAG: smoke
        run: docker compose down

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/wahid672/vector-studio
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.source=https://github.com/wahid672/vector-studio

      - name: Publish AMD64 and ARM64 images
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
